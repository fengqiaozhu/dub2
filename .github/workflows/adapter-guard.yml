name: Adapter Guard
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node ops/paperclip-adapter-guard/simulate.mjs
