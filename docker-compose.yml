# Access control is fail-closed. Copy .env.example to .env and set
# DUB_ACCESS_TOKEN, or set DUB_AUTH_MODE=disabled for a local trial.
# Compose interpolates the repo-root .env and passes the values below
# into the API container. Empty auth values are passed through as empty
# so the API can refuse to start with a configuration error; they are
# not defaulted to a shared token or to disabled.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ebook
      POSTGRES_USER: ebook
      POSTGRES_PASSWORD: ebook
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebook -d ebook"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ebook
      MINIO_ROOT_PASSWORD: ebook-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./ebook-api
    environment:
      PORT: 13000
      DATABASE_URL: postgres://ebook:ebook@postgres:5432/ebook
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ebook
      S3_ACCESS_KEY_ID: ebook
      S3_SECRET_ACCESS_KEY: ebook-secret
      S3_FORCE_PATH_STYLE: "true"
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      OPEN_AI_API_URL: ${OPEN_AI_API_URL:-https://api.deepseek.com}
      OPEN_AI_MODEL: ${OPEN_AI_MODEL:-deepseek-v4-pro}
      MOSI_API_KEY: ${MOSI_API_KEY:-}
      MOSI_BASE_URL: ${MOSI_BASE_URL:-https://studio.mosi.cn}
      FISH_API_KEY: ${FISH_API_KEY:-}
      FISH_DEFAULT_MODEL: ${FISH_DEFAULT_MODEL:-}
      FISH_SELF_HOSTED_BASE_URL: ${FISH_SELF_HOSTED_BASE_URL:-}
      DUB_ACCESS_TOKEN: ${DUB_ACCESS_TOKEN:-}
      DUB_AUTH_MODE: ${DUB_AUTH_MODE:-}
      DUB_CORS_ORIGIN: ${DUB_CORS_ORIGIN:-http://localhost:13001}
      EXPORT_PROFILE: ${EXPORT_PROFILE:-}
      FFMPEG_PATH: ${FFMPEG_PATH:-}
    ports:
      - "13000:13000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  ui:
    build:
      context: ./ebook-ui
    ports:
      - "13001:80"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
